kafka:
  bootstrap_servers:
    - localhost:9092
  
  consumer:
    group_id: rrcf-detector-consumer
    auto_offset_reset: earliest
    enable_auto_commit: true
    auto_commit_interval_ms: 5000
    session_timeout_ms: 30000
    max_poll_records: 500
    max_poll_interval_ms: 300000
  
  producer:
    client_id: rrcf-detector-producer
    linger_ms: 10
    batch_size: 65536
    batch_num_messages: 1000
    compression_type: lz4
    acks: 1
    retries: 3
    retry_backoff_ms: 100
    queue_buffering_max_messages: 100000
    queue_buffering_max_kbytes: 1048576
    
  topics:
    input: normalized-features
    output: anomaly-scores

redis:
  host: localhost
  port: 6379
  db: 0
  password: null
  socket_timeout: 5

service:
  num_workers: 4
  rrcf_window_size: 1000
  min_fill_threshold: 50
  log_level: INFO
