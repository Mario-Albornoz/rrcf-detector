# Baseline Configuration

# Shared settings for all baseline models
detector:
  # RRCF & HST & Online-iForest: Window-based settings
  window_size: 256
  min_fill_threshold: 25
  
  # Z-Score & IsoForest: Training phase settings
  training_samples: 20000 
  
  # IsoForest specific
  n_estimators: 100
  contamination: 0.1
  
  # HST specific
  n_trees: 25
  height: 8
  
  # Online-iForest specific (ICML 2024 paper defaults)
  onlineiforest:
    window_size: 226        # Sliding window size
    num_trees: 25            # Number of trees in forest
    max_leaf_samples: 25     # Max samples per leaf before split
    type: "adaptive"         # "adaptive" or "fixed"
    min_fill_threshold: 25   # Warmup samples before scoring

# Kafka settings (same as default.yaml)
kafka:
  bootstrap_servers: "localhost:9092"
  consumer_group_id: "rrcf-detector-baselines"
  input_topic: "normalized-vectors"
  output_topic: "anomaly-scores"
  auto_offset_reset: "earliest"
  
  # Producer settings
  producer:
    linger_ms: 10
    batch_size: 100000
    compression_type: "lz4"
    acks: 1
    retries: 3

# Multiprocessing
multiprocessing:
  num_workers: 4  # One worker per model (or scale per model)
  health_check_interval: 30

# Model Selection
# To run specific models, modify this list
models:
  #- rrcf
  - zscore
  #- isoforest
  #- halfspace
  # - onlineiforest  

# Stream Collector Configuration
stream_collector:
  output_file: "./data/scores.parquet"
  buffer_size: 1000
  flush_interval: 5  # seconds
  bootstrap_servers: "localhost:9092"
  topic: "anomaly-scores"
