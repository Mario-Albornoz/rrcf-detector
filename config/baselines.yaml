detector:
  window_size: 256
  min_fill_threshold: 25
  
  # Z-Score & IsoForest: the frozen models train on the whole first day of data (the warm-up
  # day). This is set in model_registry() in scripts/run_multi_model.py, which hard-codes the
  # model settings; the value below is not read.
  training_samples: 20000 

  n_estimators: 100
  contamination: 0.1

  n_trees: 25
  height: 8
  
  # Online-iForest specific (ICML 2024 paper defaults)
  onlineiforest:
    window_size: 226        # Sliding window size
    num_trees: 15            # Number of trees in forest
    max_leaf_samples: 25     # Max samples per leaf before split
    type: "adaptive"
    min_fill_threshold: 25   # Warmup samples before scoring

  rrcf_forest:
    num_trees: 5             # cost grows linearly with this
    window_size: 256         # same as rrcf, so only the number of trees differs
    min_fill_threshold: 25
    seed: 42

kafka:
  bootstrap_servers: "localhost:9092"
  consumer_group_id: "rrcf-detector-baselines"
  input_topic: "normalized-vectors"
  output_topic: "anomaly-scores"
  auto_offset_reset: "earliest"

  producer:
    linger_ms: 10
    batch_size: 100000
    compression_type: "lz4"
    acks: 1
    retries: 3

multiprocessing:
  num_workers: 4  # One worker per model (or scale per model)
  health_check_interval: 30

models:
  #- rrcf
  #- rrcf_forest
  - zscore
  #- isoforest
  #- halfspace
  # - onlineiforest  

stream_collector:
  output_file: "./data/scores.parquet"
  buffer_size: 1000
  flush_interval: 5  # seconds
  bootstrap_servers: "localhost:9092"
  topic: "anomaly-scores"
